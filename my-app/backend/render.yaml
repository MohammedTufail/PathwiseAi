services:
  - type: web
    name: pathwiseai-backend
    runtime: python
    buildCommand: pip install flask flask-cors python-dotenv requests groq gunicorn
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false